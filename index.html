    <style>
      html,
      body {
        margin: 0;

        overflow: hidden;
        background: #000;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>

  <body>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        if (params.get("fxchain") && params.get("noshuffle") && params.get("fxiteration")) return;
        if (!params.get("fxchain")) params.set("fxchain", "TEZOS");
        if (!params.get("noshuffle")) params.set("noshuffle", "1");
        if (!params.get("fxiteration")) params.set("fxiteration", "1");
        location.replace(location.pathname + "?" + params.toString());
      })();
    </script>
    <script src="/src/three.r157.min.js"></script>
