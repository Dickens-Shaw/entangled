<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entangled lab</title>
    <style>
      html {
        color-scheme: dark;
        background: #000;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      .status {
        position: fixed;
        right: 16px;
        bottom: 16px;
        color: #9dffc8;
        font: 12px/1.45 Arial, sans-serif;
        background: rgba(0, 0, 0, 0.8);
        padding: 12px 14px;
        border: 1px solid #00ff88;
        border-radius: 8px;
      }
      button {
        display: block;
        margin-top: 10px;
        background: #00ff88;
        color: #000;
        border: 0;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <div>Window ID: <span id="windowId">-</span></div>
      <div>Connected Windows: <span id="connectedCount">0</span></div>
      <div>Entanglement: <span id="entanglementStatus">None</span></div>
      <button id="open" type="button">Open Entangled Window</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
